<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jelajah Pecahan - Matematika SD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F6FAFF; --grid:#D6E6F7; --ink:#1B2A4A; --muted:#4C5E86; --card:#FFFFFF;
  --yellow:#FFC933; --pink:#FF8FA3; --teal:#1FAE97; --red:#E5484D; --blue:#3E7BFA;
  --soft-yellow:#FFF1BD; --soft-blue:#E1ECFF; --soft-teal:#D4F4EC; --soft-pink:#FFE1E7;
  --shadow:#1B2A4A; --on:#1B2A4A; --ok:#0F8F68; --bad:#D63D44;
  --water1:#7FB0FF; --water2:#A9CBFF; --water3:#5A93F0;
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="light"]){
    --paper:#101B35; --grid:#1B2C54; --ink:#EEF3FF; --muted:#AAB8DC; --card:#182647;
    --soft-yellow:#4A3F14; --soft-blue:#1D3465; --soft-teal:#12423F; --soft-pink:#4D2330;
    --shadow:#050A18; --ok:#4FD1A5; --bad:#FF7A80; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --paper:#101B35; --grid:#1B2C54; --ink:#EEF3FF; --muted:#AAB8DC; --card:#182647;
  --soft-yellow:#4A3F14; --soft-blue:#1D3465; --soft-teal:#12423F; --soft-pink:#4D2330;
  --shadow:#050A18; --ok:#4FD1A5; --bad:#FF7A80; color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
@supports (height:100dvh){html{height:100dvh}}
[hidden]{display:none!important}
body{
  margin:0; height:100%; overflow:hidden; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px; font-family:'Nunito','Segoe UI',system-ui,sans-serif; font-size:16px; line-height:1.4;
}
h1,h2,h3{font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif; line-height:1.1; margin:0}
p{margin:.3rem 0}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
.app{height:100%; display:flex; flex-direction:column}

/* Bar atas */
.bar{flex:none; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 12px; border-bottom:2px solid var(--ink); background:var(--paper)}
.brand{display:flex; align-items:center; gap:8px; border:0; background:none; color:var(--ink); cursor:pointer; text-align:left; padding:0; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.05rem; line-height:1}
.brand small{display:block; font-family:'Nunito',sans-serif; font-weight:700; font-size:.72rem; color:var(--muted); margin-top:2px}
.logo{width:34px; height:34px; flex:none}
.tools{display:flex; gap:6px}
.tbtn{border:2px solid var(--ink); background:var(--card); color:var(--ink); border-radius:999px; padding:2px 11px; font:700 .8rem 'Nunito',sans-serif; cursor:pointer; min-height:34px}
.tbtn[aria-pressed="true"]{background:var(--teal); color:var(--on)}

/* Layar */
.main{flex:1; min-height:0; position:relative}
.screen{position:absolute; top:0; bottom:0; left:0; right:0; margin:0 auto; max-width:1100px; display:flex; flex-direction:column; padding:8px 12px 10px}
.fitbox{flex:1; min-height:0; min-width:0; overflow:hidden; display:grid; justify-items:center; align-items:center}
.fitbox.top{align-items:start}
.fit-in{width:100%; transform-origin:center center}
.fitbox.top .fit-in{transform-origin:top center}

/* Komponen umum */
.btn{border:2px solid var(--ink); background:var(--yellow); color:var(--on); border-radius:999px; padding:6px 18px; min-height:42px; font:800 1rem 'Baloo 2',sans-serif; cursor:pointer; box-shadow:0 3px 0 var(--shadow); transition:transform .08s, box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(2px); box-shadow:0 1px 0 var(--shadow)}
.btn:disabled{opacity:.55; cursor:not-allowed}
.btn.alt{background:var(--soft-blue); color:var(--ink)}
.btn.ghost{background:var(--card); color:var(--ink)}
.row{display:flex; flex-wrap:wrap; gap:10px; margin-top:8px}
.seg{display:inline-flex; flex-wrap:nowrap; border:2px solid var(--ink); border-radius:999px; overflow:hidden; background:var(--card)}
.seg button{border:0; background:transparent; color:var(--ink); padding:6px 14px; min-height:40px; font:700 .95rem 'Baloo 2',sans-serif; cursor:pointer; white-space:nowrap}
.seg button + button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--yellow); color:var(--on)}
.seg.sm button{padding:4px 12px; min-height:36px; font-size:.9rem}
label.rng{display:block; margin:2px 0; font-weight:700; font-size:.88rem}
input[type=range]{width:100%; height:24px; accent-color:var(--blue); margin:0}
output{font-family:'Baloo 2',sans-serif; font-weight:800; background:var(--soft-blue); padding:0 8px; border-radius:8px; margin-left:4px}
.note{color:var(--muted); font-size:.9rem}
.warn{color:var(--bad); font-weight:800}
.hl{background:var(--soft-yellow); padding:0 7px; border-radius:7px; font-weight:800; white-space:nowrap}

/* Pecahan */
.fr{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.1; margin:0 .16em; font-family:'Baloo 2','Trebuchet MS',sans-serif; font-weight:800}
.fr > b{display:block; font-weight:inherit; padding:0 .28em; white-space:nowrap}
.fr > b:first-child{border-bottom:.11em solid currentColor}
.mx{display:inline-flex; align-items:center; vertical-align:middle; font-family:'Baloo 2','Trebuchet MS',sans-serif; font-weight:800}
.mx > .w{font-size:1.15em; margin-right:.1em}
.ie{display:inline-flex; align-items:center; flex-wrap:wrap; gap:.1em .3em; font:800 1.15rem/1.3 'Baloo 2','Trebuchet MS',sans-serif}
.expr{font:800 clamp(1.1rem,3.6vw,1.6rem)/1.25 'Baloo 2','Trebuchet MS',sans-serif; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:.1rem .4rem; padding:6px 8px; margin:6px 0; background:var(--soft-yellow); border:2px dashed var(--ink); border-radius:12px}
.expr.ok{background:var(--soft-teal)}
.expr.sm{background:var(--soft-blue); font-size:clamp(1rem,3vw,1.3rem)}

/* Batang */
.fbars{display:grid; gap:5px; margin:4px 0}
.fbrow{display:grid; grid-template-columns:54px 1fr; gap:8px; align-items:center}
.fbrow > span{font:800 .85rem 'Baloo 2',sans-serif; text-align:center}
.fbrow .fr{font-size:.9rem; margin:0}
.fbstack{display:grid; gap:4px}
.fbar{display:flex; height:28px; border:2px solid var(--ink); border-radius:8px; overflow:hidden; background:var(--card)}
.fbar i{flex:1; min-width:0; border-right:2px solid var(--ink); display:grid; place-items:center; font:800 .8rem 'Baloo 2',sans-serif; font-style:normal; color:var(--on)}
.fbar.thin i{border-right-width:1px}
.fbar.xthin i{border-right-width:0}
.fbar i:last-child{border-right:0}
.fbar i.a{background:var(--blue)}
.fbar i.b{background:var(--pink)}
.fbar i.g{background:var(--teal)}
.fbar i.x{background:repeating-linear-gradient(45deg,var(--pink),var(--pink) 4px,var(--card) 4px,var(--card) 8px)}
.fbar.click i{cursor:pointer}
.fbar.big{height:clamp(30px,6.5vmin,44px)}
.pies{display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin:4px 0}
.pies svg{width:56px; height:56px}

/* ===== Animasi: panggung ===== */
.anim{position:absolute; top:0; bottom:0; left:0; right:0; display:flex; flex-direction:column; gap:8px}
.stage{flex:1; border:2px solid var(--ink); border-radius:16px; background:var(--card); box-shadow:4px 4px 0 var(--shadow); position:relative}
.stage .fit-in{display:flex; justify-content:center}
.side{flex:none; display:flex; flex-direction:column; gap:8px}
.capbox{border:2px dashed var(--ink); border-radius:12px; background:var(--soft-yellow); padding:8px 12px; min-height:5.6em; display:flex; align-items:center}
.cap{font-size:clamp(.98rem,2.3vmin + .45rem,1.3rem); font-weight:700; line-height:1.35; width:100%}
.cap b{background:var(--card); border-radius:6px; padding:0 5px}
.ctrls{display:flex; align-items:center; gap:6px}
.cbtn{flex:none; width:44px; height:44px; border-radius:50%; border:2px solid var(--ink); background:var(--card); color:var(--ink); font:800 1.1rem 'Baloo 2',sans-serif; cursor:pointer; display:grid; place-items:center; padding:0; box-shadow:0 3px 0 var(--shadow)}
.cbtn.main{background:var(--yellow); color:var(--on)}
.cbtn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--shadow)}
.dots{flex:1; display:flex; gap:7px; justify-content:center; flex-wrap:wrap}
.dot{width:14px; height:14px; border-radius:50%; border:2px solid var(--ink); background:var(--card); padding:0; cursor:pointer}
.dot.on{background:var(--yellow); transform:scale(1.25)}
.dot.past{background:var(--teal)}
@media (min-aspect-ratio:12/10) and (min-width:560px){
  .anim{flex-direction:row}
  .side{width:min(36%,360px); justify-content:center}
  .capbox{min-height:9em}
}

/* Isi panggung */
.sc{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; width:100%; padding:10px 12px}
.ex{font:800 clamp(1.3rem,4.4vmin + .4rem,2.3rem)/1.3 'Baloo 2','Trebuchet MS',sans-serif; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:.1rem .5rem; text-align:center}
.ex em{font-style:normal; color:var(--red); background:var(--soft-pink); padding:0 .25em; border-radius:6px; display:inline-block}
.ex .ok{color:var(--ok)}
.brow{display:grid; grid-template-columns:56px 1fr; align-items:center; gap:10px; width:min(100%,560px)}
.blab{font:800 1.1rem 'Baloo 2',sans-serif; text-align:center}
.gwrap{position:relative; display:grid; gap:12px; width:min(100%,560px)}
.guide{position:absolute; top:-6px; bottom:-6px; left:calc(66px + (100% - 66px)/2); border-left:3px dashed var(--red); animation:fadeUp .6s .5s both}
.pa{width:var(--sz,min(40vmin,230px)); height:auto; display:block; overflow:visible}
.pa .s{fill:var(--card); stroke:var(--ink); stroke-width:2.5; stroke-linejoin:round; transform-box:view-box; transform-origin:50% 50%}
.pa .s.col{fill:var(--blue)}
.pa .s.sl{animation:sliceIn .6s cubic-bezier(.3,1.4,.5,1) both; animation-delay:var(--d,0s)}
.pa .s.fl{animation:fillIn .5s ease both; animation-delay:var(--d,0s)}
.pa .s.pp{animation:popIn .5s cubic-bezier(.3,1.5,.5,1) both}
.pwrap{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; --sz:min(26vmin,120px)}
.lbls{display:grid; gap:8px; font-weight:800}
.lbls span{display:flex; align-items:center; gap:8px}
.tagc{display:inline-block; border-radius:8px; padding:1px 9px; border:2px solid var(--ink); font:800 .95rem 'Baloo 2',sans-serif}
.area{display:grid; gap:0; border:3px solid var(--ink); background:var(--card)}
.area > div{position:relative; width:var(--cs); height:var(--cs); border:1px solid var(--muted)}
.area u{position:absolute; inset:0; text-decoration:none}
.area .lA{background:var(--blue); opacity:.55}
.area .lC{background:var(--pink); opacity:.6}
.area .lO{background:var(--teal); border:2px solid var(--ink)}
.area.m3 .lA,.area.m3 .lC{opacity:.28}
.areaw{--cs:clamp(30px,8vmin,56px); display:grid; grid-template-columns:auto auto; gap:6px 8px; align-items:center; justify-items:center}
.chp{width:clamp(30px,6.5vmin,42px); height:clamp(30px,6.5vmin,42px); border:2px solid var(--ink); border-radius:9px; display:grid; place-items:center; font:800 .75rem 'Baloo 2',sans-serif; color:var(--on)}
.chp.g1{background:var(--blue)} .chp.g2{background:var(--teal)} .chp.g3{background:var(--pink)}
.grps{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
.grp{display:flex; flex-direction:column; align-items:center; gap:4px}
.grp > div{display:flex; gap:4px; padding:6px; border:2px dashed var(--ink); border-radius:12px}
.grp small{font-weight:800}
.mult{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center}
.mult .lb{font-weight:800; min-width:5.5em; text-align:right}
.mchip{min-width:2.2em; text-align:center; padding:2px 8px; border:2px solid var(--ink); border-radius:999px; background:var(--soft-blue); font:800 1.2rem 'Baloo 2',sans-serif}
.mchip.hi{background:var(--yellow); color:var(--on); animation:pulse 1s ease-in-out infinite}
.g100{display:grid; grid-template-columns:repeat(10,1fr); grid-template-rows:repeat(10,1fr); grid-auto-flow:column; width:min(100%,var(--gs,230px)); aspect-ratio:1; border:2px solid var(--ink); background:var(--card); margin:0 auto}
.g100 i{border:1px solid var(--grid)}
.g100 i.on{background:var(--blue); border-color:var(--card)}
.pvt{display:grid; grid-template-columns:repeat(4,auto); gap:6px 10px; align-items:end; justify-items:center}
.pvt .h{font:800 .85rem 'Baloo 2',sans-serif; text-align:center; background:var(--soft-blue); border:2px solid var(--ink); border-radius:8px; padding:2px 8px}
.pvt .d{font:800 clamp(2.4rem,9vmin,4rem)/1 'Baloo 2',sans-serif; min-width:1.1em; text-align:center}
.pvt .c{font:800 clamp(2.4rem,9vmin,4rem)/1 'Baloo 2',sans-serif; align-self:end}
.vadd{display:grid; grid-template-columns:1.6ch 1.2ch .7ch 1.2ch 1.2ch; column-gap:.35em; row-gap:.1em; font:800 clamp(1.8rem,7vmin,3rem)/1.2 'Courier New',monospace; justify-items:center}
.vadd .rule{grid-column:1 / -1; width:100%; height:4px; background:var(--ink); border-radius:2px}
.vadd .cy{color:var(--red); font-size:.6em; align-self:end}
.vadd .z{color:var(--red); background:var(--soft-pink); border-radius:6px}
.vadd .rs{color:var(--ok)}

/* Animasi dasar */
@keyframes popIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes sliceIn{from{opacity:0;transform:translate(var(--tx,0px),var(--ty,0px)) scale(.7)}to{opacity:1;transform:none}}
@keyframes fillIn{from{fill:var(--card)}to{fill:var(--blue)}}
@keyframes fromBelow{from{transform:translateY(1.25em);opacity:.2}to{transform:none;opacity:1}}
@keyframes fromAbove{from{transform:translateY(-1.25em);opacity:.2}to{transform:none;opacity:1}}
.an{animation:fadeUp .6s ease both; animation-delay:var(--d,0s)}
.an-pop{animation:popIn .45s cubic-bezier(.3,1.5,.5,1) both; animation-delay:var(--d,0s)}
.an-down{animation:fadeDown .55s ease both; animation-delay:var(--d,0s)}
.an-grow{transform-origin:left center; animation:growX .6s ease both; animation-delay:var(--d,0s)}
.an-pulse{animation:pulse 1s ease-in-out infinite; animation-delay:var(--d,0s)}
.fr.flip > b:first-child{animation:fromBelow .9s ease both; animation-delay:var(--d,0s); color:var(--red)}
.fr.flip > b:last-child{animation:fromAbove .9s ease both; animation-delay:var(--d,0s); color:var(--red)}

/* ===== Beranda ===== */
.hero{display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; margin-bottom:10px}
.hero h1{font-size:clamp(1.5rem,4.6vw,2.6rem); font-weight:800}
.hero .lead{color:var(--muted); font-weight:600; font-size:clamp(.9rem,2vw,1.05rem); max-width:56ch}
.hero-art{position:relative; width:clamp(110px,22vmin,200px)}
.hero-art svg.main{width:100%; height:auto; display:block}
.mascot-pos{position:absolute; right:-10px; bottom:-8px; display:flex; flex-direction:column; align-items:flex-end; gap:2px}
.mascot-slot{display:block; flex:none; width:36px}
.mascot-slot svg{display:block; width:100%; height:auto}
.bubble{background:var(--card); border:2px solid var(--ink); border-radius:12px 12px 3px 12px; padding:3px 9px; font-weight:800; font-size:.78rem; line-height:1.25; box-shadow:2px 2px 0 var(--shadow)}
.progress{display:inline-block; margin-top:6px; padding:3px 12px; background:var(--card); border:2px solid var(--ink); border-radius:12px; font-weight:700; font-size:.82rem}
.menu{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
@media (max-width:760px){ .menu{grid-template-columns:repeat(2,1fr)} }
.mitem{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; padding:10px 8px; border:2px solid var(--ink); border-radius:14px; background:var(--bg); color:var(--ink); cursor:pointer; box-shadow:3px 3px 0 var(--shadow); transition:transform .1s, box-shadow .1s; min-height:96px}
.mitem:hover{transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--shadow)}
.mitem .sym{width:52px; height:52px; display:grid; place-items:center; border:2px solid var(--ink); border-radius:50%; background:var(--c); color:var(--on); font:800 1.2rem 'Baloo 2',sans-serif}
.mitem b{display:block; font:800 1rem/1.1 'Baloo 2',sans-serif}
.mitem small{display:block; font-size:.78rem; line-height:1.25; color:var(--muted); font-weight:600}
@media (max-height:700px){ .mitem small{display:none} .mitem{min-height:78px} .mitem .sym{width:42px;height:42px;font-size:1rem} }
.mitem .chk{position:absolute; top:6px; right:8px; width:22px; height:22px; border-radius:50%; border:2px solid var(--ink); background:var(--card); display:none; place-items:center; font-weight:800; font-size:.8rem; color:var(--ok)}
.mitem.done .chk{display:grid}

/* ===== Layar materi ===== */
.tp-head{flex:none; display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; margin-bottom:8px}
.tp-head h2{flex:1; min-width:0; font-size:clamp(1.1rem,3.2vw,1.6rem); font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.nbtn{flex:none; width:38px; height:38px; border-radius:50%; border:2px solid var(--ink); background:var(--card); color:var(--ink); font:800 1.3rem/1 'Baloo 2',sans-serif; cursor:pointer; padding:0}
.tabs3{flex:none}
@media (max-width:640px){ .tabs3{order:5; flex-basis:100%; display:flex} .tabs3 button{flex:1; padding:4px 6px} }
.tp-body{flex:1; min-height:0; position:relative}
.pane{position:absolute; top:0; bottom:0; left:0; right:0; display:flex; flex-direction:column; gap:6px}
.pane[hidden]{display:none}
.subtabs{flex:none; align-self:flex-start; max-width:100%; overflow-x:auto}
.wdg[hidden]{display:none}
.ctl{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); column-gap:16px}
.out{margin-top:2px}
.sheetlite{background:var(--card); border:2px solid var(--ink); border-radius:14px; box-shadow:4px 4px 0 var(--shadow); padding:10px 12px}
.two{display:grid; grid-template-columns:minmax(0,170px) 1fr; gap:12px; align-items:center}
.two > *{min-width:0}
@media (max-width:520px){ .two{grid-template-columns:1fr} }
.pieBig svg{display:block; width:100%; max-width:170px; margin:0 auto; cursor:pointer}
.pieBig path,.pieBig circle{transition:fill .15s}
.big-fr{font-size:2.2rem; text-align:center}
.lbl{display:grid; gap:2px; font-weight:700; font-size:.9rem}
.lbl span b{color:var(--blue)}
.mini-btns{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
.mini-btns .btn{min-height:36px; padding:3px 14px; font-size:.9rem}
.circ-svg{display:block; max-height:170px; width:auto; max-width:100%; margin:0 auto}
.pvrow{display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; margin:4px 0}
.pvcol{display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 8px; border:2px solid var(--ink); border-radius:12px; background:var(--soft-blue); min-width:92px}
.pvcol .pvl{font-weight:800; font-size:.78rem; text-align:center; line-height:1.15}
.pvcol .pvd{font:800 1.8rem/1 'Baloo 2',sans-serif}
.pvcol button{width:44px; height:34px; border:2px solid var(--ink); border-radius:9px; background:var(--yellow); color:var(--on); font:800 1.2rem 'Baloo 2',sans-serif; cursor:pointer; padding:0}
.pvcomma{font:800 2.4rem 'Baloo 2',sans-serif; align-self:center}
.vert{font:700 1.2rem/1.3 'Courier New',monospace; margin:4px 0; padding:6px 12px; background:var(--soft-yellow); border:2px dashed var(--ink); border-radius:12px; display:inline-block; max-width:100%; color:var(--ink)}

/* Latihan */
.practice{background:var(--card); border:2px solid var(--ink); border-radius:14px; box-shadow:4px 4px 0 var(--shadow); padding:10px 14px}

.qin{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:6px 0}
.qin input[type=text]{width:84px; min-height:44px; text-align:center; font:800 1.25rem 'Baloo 2',sans-serif; border:2px solid var(--ink); border-radius:10px; background:var(--card); color:var(--ink)}
.qin .stack{display:inline-flex; flex-direction:column; align-items:center; gap:3px}
.qin .stack input{width:68px; min-height:38px}
.qin .stack hr{width:100%; border:0; border-top:3px solid var(--ink); margin:0}
.qin .unit{font-weight:800}
.qin .opts{width:100%; display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:6px}
.opt{display:flex; gap:10px; align-items:center; text-align:left; width:100%; padding:6px 10px; min-height:46px; border:2px solid var(--ink); border-radius:12px; background:var(--card); color:var(--ink); font:700 1rem 'Nunito',sans-serif; cursor:pointer}
.opt .ltr{flex:none; width:28px; height:28px; border-radius:50%; background:var(--soft-blue); display:grid; place-items:center; font:800 .9rem 'Baloo 2',sans-serif; border:2px solid var(--ink)}
.opt.ok{background:var(--soft-teal); border-color:var(--ok)}
.opt.bad{background:var(--soft-pink); border-color:var(--bad)}
.opt:disabled{cursor:default}
.fbtxt{margin:4px 0; font-size:.95rem; line-height:1.35}
.fbtxt .good{color:var(--ok); font-weight:800}
.fbtxt .badt{color:var(--bad); font-weight:800}
.pstar{font-size:2rem; letter-spacing:.15em; color:var(--yellow); -webkit-text-stroke:1.5px var(--ink); line-height:1.2}

#confetti{position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:50}

  *,*::before,*::after{animation:none!important; transition-duration:.01ms!important}
}

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const MINUS='\u2212';
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;};
const lcm=(a,b)=>a/gcd(a,b)*b;
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};
const simp=(n,d)=>{const g=gcd(n,d)||1;return [n/g,d/g];};
const fmtNum=n=>n.toLocaleString('id-ID',{maximumFractionDigits:3});
const WORDS=['nol','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas','dua belas'];
const pow10=n=>Math.pow(10,n);

/* ===== Tampilan pecahan ===== */
const fr=(n,d)=>`<span class="fr"><b>${n}</b><b>${d}</b></span>`;
const mx=(w,n,d)=>n===0?`<span class="mx"><span class="w">${w}</span></span>`:`<span class="mx"><span class="w">${w}</span>${fr(n,d)}</span>`;
function toMixed(n,d){const s=simp(n,d);return {w:Math.floor(s[0]/s[1]),n:s[0]%s[1],d:s[1]};}
function finalHtml(num,den){
  const s=simp(num,den);
  if(s[1]===1) return String(s[0]);
  let h=fr(s[0],s[1]);
  if(s[0]>s[1]){const m=toMixed(s[0],s[1]); h+=' = '+mx(m.w,m.n,m.d);}
  return h;
}
function chainItems(num,den){
  const s=simp(num,den), items=[fr(num,den)];
  if(s[1]!==den) items.push(s[1]===1?String(s[0]):fr(s[0],s[1]));
  if(s[1]>1&&s[0]>s[1]){const m=toMixed(s[0],s[1]); items.push(mx(m.w,m.n,m.d));}
  return items;
}
const chain=(num,den)=>{const it=chainItems(num,den);return it.length>1?it.join(' = '):null;};
const chainTail=(num,den)=>chainItems(num,den).slice(1).map(x=>' = '+x).join('');
function fbar(cells,opts){
  opts=opts||{}; const n=cells.length;
  const cls='fbar '+(n>40?'xthin':n>24?'thin':'')+(opts.click?' click':'');
  return `<div class="${cls}">${cells.map((c,i)=>`<i class="${c}" ${opts.click?`data-i="${i}"`:''}>${opts.nums?(opts.off||0)+i+1:''}</i>`).join('')}</div>`;
}
const cellsOf=(n,d,c)=>Array.from({length:d},(_,i)=>i<n?c:'');
function barRow(label,inner){return `<div class="fbrow"><span>${label}</span>${inner}</div>`;}
function multiBars(L,aN,bN,cA,cB){
  const rows=Math.max(1,Math.ceil((aN+bN)/L)), out=[];
  for(let r=0;r<rows;r++){
    const cells=[]; for(let i=0;i<L;i++){const idx=r*L+i; cells.push(idx<aN?cA:idx<aN+bN?cB:'');}
    out.push(fbar(cells));
  }
  return `<div class="fbstack">${out.join('')}</div>`;
}
function pieSVG(n,d,click){
  const shaded=Array.isArray(n)?n:Array.from({length:d},(_,i)=>i<n);
  const R=46; let s='<svg viewBox="0 0 100 100" role="img" aria-label="Lingkaran dibagi '+d+' bagian">';
  if(d===1){
    s+=`<circle cx="50" cy="50" r="${R}" ${click?'data-i="0"':''} style="fill:${shaded[0]?'var(--blue)':'var(--card)'};stroke:var(--ink);stroke-width:3"/>`;
  }else{
    for(let i=0;i<d;i++){
      const a1=-Math.PI/2+i*2*Math.PI/d, a2=-Math.PI/2+(i+1)*2*Math.PI/d;
      const x1=50+R*Math.cos(a1), y1=50+R*Math.sin(a1), x2=50+R*Math.cos(a2), y2=50+R*Math.sin(a2);
      s+=`<path ${click?`data-i="${i}"`:''} d="M50 50 L${x1.toFixed(2)} ${y1.toFixed(2)} A${R} ${R} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" style="fill:${shaded[i]?'var(--blue)':'var(--card)'};stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round"/>`;
    }
  }
  return s+'</svg>';
}
function pies(whole,n,d){
  let h='<div class="pies">';
  for(let i=0;i<whole;i++) h+=pieSVG(d,d);
  if(n>0||whole===0) h+=pieSVG(n,d);
  return h+'</div>';
}
function decStr(int,scale,trim){
  const s=String(int).padStart(scale+1,'0'); const a=scale?s.slice(0,-scale):s; let b=scale?s.slice(-scale):'';
  if(trim) b=b.replace(/0+$/,'');
  return b?a+','+b:a;
}
function parseDec(s){
  s=s.trim().replace('.',','); const m=s.match(/^(\d{1,3})(?:,(\d{1,3}))?$/); if(!m) return null;
  const f=m[2]||''; return {i:parseInt(m[1]+f,10),s:f.length};
}
const MIXPAIRS=[[2,2],[3,3],[4,4],[5,5],[2,4],[3,6],[4,2],[6,3],[4,8],[5,10]];
function genMixedSub(){
  for(;;){
    const pr=pick(MIXPAIRS), d1=pr[0], d2=pr[1];
    const w1=ri(2,5), w2=ri(1,w1-1), n1=ri(1,d1-1), n2=ri(1,d2-1);
    const N1=w1*d1+n1, N2=w2*d2+n2, L=lcm(d1,d2), x=N1*L/d1, y=N2*L/d2;
    if(x>y&&simp(x-y,L)[1]>1) return {w1,n1,d1,w2,n2,d2,N1,N2,L,x,y};
  }
}

/* ===== Simpan progres ===== */
let state={visited:{},best:{}};
try{const s=localStorage.getItem('jp1'); if(s) state=Object.assign(state,JSON.parse(s));}catch(e){}

/* ===== Audio ===== */
let ac=null, sfxOn=true, musicOn=false, musicTimer=null, mi=0;
function actx(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}}
  if(ac&&ac.state==='suspended') ac.resume();
  return ac;
}
function tone(f,d,type,vol,when,music){
  if(music?!musicOn:!sfxOn) return;
  const c=actx(); if(!c) return;
  const t=c.currentTime+(when||0), o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol||.1,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+(d||.15));
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+(d||.15)+.03);
}
const sfx={
  click:()=>tone(660,.07,'triangle',.07),
  pop:()=>tone(880,.06,'sine',.07),
  tick:()=>{tone(520,.06,'sine',.05);tone(780,.08,'sine',.05,.07);},
  ok:()=>{tone(523,.12,'triangle',.12);tone(659,.12,'triangle',.12,.1);tone(784,.22,'triangle',.12,.2);},
  bad:()=>{tone(220,.18,'sawtooth',.07);tone(165,.26,'sawtooth',.07,.15);},
  win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.12,i*.12))
};
const MEL=[392,440,523.25,440,392,329.63,293.66,329.63,392,440,523.25,587.33,523.25,440,392,329.63];
function updateTools(){
  $('#sfxBtn').setAttribute('aria-pressed',sfxOn); $('#sfxBtn').textContent=sfxOn?'Suara nyala':'Suara mati';
  $('#musicBtn').setAttribute('aria-pressed',musicOn); $('#musicBtn').textContent=musicOn?'Musik nyala':'Musik mati';
}
$('#sfxBtn').addEventListener('click',()=>{sfxOn=!sfxOn;updateTools();sfx.click();});
$('#musicBtn').addEventListener('click',()=>{
  musicOn=!musicOn; clearInterval(musicTimer);
  if(musicOn){actx(); musicTimer=setInterval(()=>tone(MEL[mi++%MEL.length],.5,'triangle',.04,0,true),480);}
  updateTools();
});

/* ===== Maskot ===== */
const MASCOT=`<svg viewBox="0 0 120 214" aria-hidden="true">
<rect x="30" y="14" width="60" height="28" rx="11" style="fill:#FF8FA3;stroke:#1B2A4A;stroke-width:4"/>

<rect x="36" y="60" width="6" height="96" style="fill:#fff;opacity:.45"/>
<path d="M30 160 L60 208 L90 160 Z" style="fill:#F4D3A8;stroke:#1B2A4A;stroke-width:4;stroke-linejoin:round"/>
<path d="M49 192 L60 208 L71 192 Z" style="fill:#1B2A4A"/>
<circle cx="47" cy="94" r="7" style="fill:#1B2A4A"/><circle cx="73" cy="94" r="7" style="fill:#1B2A4A"/>
<circle cx="49" cy="91" r="2.5" style="fill:#fff"/><circle cx="75" cy="91" r="2.5" style="fill:#fff"/>
<path d="M47 114 Q60 130 73 114" style="fill:none;stroke:#1B2A4A;stroke-width:4;stroke-linecap:round"/>
<circle cx="39" cy="110" r="5" style="fill:#FF8FA3;opacity:.8"/><circle cx="81" cy="110" r="5" style="fill:#FF8FA3;opacity:.8"/>

let fitRaf=0;

/* ===== Komponen animasi ===== */
const dl=(i,g,b)=>`style="--d:${((b||0)+i*(g==null?.08:g)).toFixed(2)}s"`;
function abarC(cl,o){
  o=o||{}; const n=cl.length, t=n>40?' xthin':n>24?' thin':'';

    const an=(o.pop||(o.popCls&&c===o.popCls))?' an-pop':(o.down&&c?' an-down':'');

}
const abar=(d,n,cls,o)=>abarC(Array.from({length:d},(_,i)=>i<n?cls:''),o);
const brow=(label,inner)=>`<div class="brow"><div class="blab">${label}</div>${inner}</div>`;

const seq=(parts,g,b)=>parts.map((p,i)=>`<span class="an" style="--d:${((b||0)+i*(g||.55)).toFixed(2)}s">${p}</span>`).join(' ');
const frFlip=(n,d,dd)=>`<span class="fr flip" style="--d:${dd}s"><b>${n}</b><b>${d}</b></span>`;
const gwrap=(...rows)=>`<div class="gwrap">${rows.join('')}<div class="guide"></div></div>`;
function pieAnim(d,n,mode){
  const R=46; let s='<svg class="pa" viewBox="0 0 100 100" aria-hidden="true">';
  if(d===1){ s+=`<circle class="s${mode==='pop'?' pp':''}${n?' col':''}" cx="50" cy="50" r="${R}"/>`; }
  else for(let i=0;i<d;i++){
    const a1=-Math.PI/2+i*2*Math.PI/d, a2=-Math.PI/2+(i+1)*2*Math.PI/d, mid=(a1+a2)/2;
    const x1=50+R*Math.cos(a1), y1=50+R*Math.sin(a1), x2=50+R*Math.cos(a2), y2=50+R*Math.sin(a2);
    const cls='s'+(i<n?' col':'')+(mode==='slice'?' sl':'')+(mode==='fill'&&i<n?' fl':'');
    s+=`<path class="${cls}" style="--tx:${(Math.cos(mid)*11).toFixed(1)}px;--ty:${(Math.sin(mid)*11).toFixed(1)}px;--d:${(i*(mode==='fill'?.3:.07)).toFixed(2)}s" d="M50 50 L${x1.toFixed(2)} ${y1.toFixed(2)} A${R} ${R} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z"/>`;
  }
  return s+'</svg>';
}
const pwrap=(inner,sz)=>`<div class="pwrap" ${sz?`style="--sz:${sz}"`:''}>${inner}</div>`;
function areaGrid(a,b,c,d,mode){
  let cells='';
  for(let r=0;r<d;r++) for(let k=0;k<b;k++){
    const A=k<a, C=r<c; let u='';
    if(mode>=1&&A) u+=`<u class="lA${mode===1?' an':''}" ${dl(k,.18)}></u>`;
    if(mode>=2&&C) u+=`<u class="lC${mode===2?' an':''}" ${dl(r,.18)}></u>`;
    if(mode>=3&&A&&C) u+=`<u class="lO an-pop" ${dl(r*b+k,.07)}></u>`;
    cells+=`<div>${u}</div>`;
  }
  return `<div class="areaw"><span></span><div class="blab">${mode>=1?fr(a,b):'&nbsp;'}</div><div class="blab">${mode>=2?fr(c,d):'&nbsp;'}</div><div class="area m${mode}" style="grid-template-columns:repeat(${b},var(--cs))">${cells}</div></div>`;
}
const mult=(lb,arr,hi,b)=>`<div class="mult"><span class="lb an" style="--d:${b}s">${lb}</span>${arr.map((v,i)=>`<span class="mchip${v===hi?' hi':''} an-pop" ${dl(i,.3,b+.3)}>${v}</span>`).join('')}</div>`;
function vadd(stage){
  const z=stage===5?`<span class="z an-pop" style="--d:.5s">0</span>`:`<span class="z">0</span>`;
  const e='<span></span>';
  let h='<div class="vadd">';
  h+=e+(stage===6?`<span class="cy an-pop" style="--d:2.2s">1</span>`:e)+e+e+e;
  h+=`${e}<span>2</span><span>,</span><span>8</span><span>5</span>`;
  h+=`<span>+</span><span>1</span><span>,</span><span>4</span>${z}`;
  h+='<div class="rule"></div>';
  h+=stage===6?`${e}<span class="rs an-pop" style="--d:3.4s">4</span><span class="rs an" style="--d:3.4s">,</span><span class="rs an-pop" style="--d:1.9s">2</span><span class="rs an-pop" style="--d:.7s">5</span>`:e+e+e+e+e;
  return h+'</div>';
}

 {cap:`Ini satu pizza utuh. Kita akan membaginya menjadi bagian-bagian yang <b>sama besar</b>.`,

 {cap:`Pizza dibagi menjadi <b>8</b> bagian sama besar. Banyak bagian seluruhnya disebut <b>penyebut</b>.`,

/* ===== Pemutar animasi ===== */
function Player(root,steps){
  const stage=$('[data-stage]',root), cap=$('[data-cap]',root), dots=$('[data-dots]',root), pb=$('[data-c="play"]',root);
  let i=0, playing=false, timer=null;
  dots.innerHTML=steps.map((_,k)=>`<button class="dot" data-k="${k}" aria-label="Langkah ${k+1}"></button>`).join('');
  const dotEls=$$('.dot',dots);
  function upd(){
    dotEls.forEach((d,k)=>{d.classList.toggle('on',k===i); d.classList.toggle('past',k<i);});
    pb.textContent=playing?'❚❚':(i>=steps.length-1?'↻':'▶');
  }
  function render(tick){
    stage.innerHTML=steps[i].html(); cap.innerHTML=steps[i].cap; upd();
    if(tick) sfx.tick();
    scheduleFit();
  }
  function sched(){
    clearTimeout(timer); if(!playing) return;
    if(i>=steps.length-1){playing=false; upd(); return;}
    timer=setTimeout(()=>{i++; render(true); sched();},steps[i].t||5200);
  }
  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-c],[data-k]'); if(!b||!root.contains(b)) return;
    if(b.dataset.k!==undefined){playing=false; clearTimeout(timer); i=+b.dataset.k; render(true); return;}
    const c=b.dataset.c;
    if(c==='next'){playing=false; clearTimeout(timer); if(i<steps.length-1) i++; render(true);}
    else if(c==='prev'){playing=false; clearTimeout(timer); if(i>0) i--; render(true);}
    else if(c==='replay'){i=0; playing=true; render(true); sched();}
    else if(c==='play'){
      if(playing){playing=false; clearTimeout(timer); upd();}
      else{if(i>=steps.length-1) i=0; playing=true; render(false); sched();}
    }
  });
  return {start(){i=0; playing=!reduce; render(false); sched();}, stop(){playing=false; clearTimeout(timer); upd();}};
}

/* ===== Pembuat penggeser ===== */
function W(id,specs,render){
  const p=$('#'+id), ctl=$('.ctl',p), out=$('.out',p);
  ctl.innerHTML=specs.map(s=>`<label class="rng">${s.label}: <output></output><input type="range" data-k="${s.k}"></label>`).join('');
  const els={}, outs={}, vals={};
  specs.forEach(s=>{const el=$('input[data-k="'+s.k+'"]',ctl); els[s.k]=el; outs[s.k]=el.previousElementSibling; vals[s.k]=s.val;});
  const bound=(x,v)=>typeof x==='function'?x(v):x;
  function sync(){
    for(let pass=0;pass<2;pass++) specs.forEach(s=>{
      const mn=bound(s.min,vals), mxv=bound(s.max,vals), el=els[s.k];
      el.min=mn; el.max=mxv; vals[s.k]=Math.max(mn,Math.min(mxv,vals[s.k])); el.value=vals[s.k]; outs[s.k].textContent=vals[s.k];
    });
  }
  ctl.addEventListener('input',e=>{const k=e.target.dataset.k; if(!k) return; vals[k]=+e.target.value; sync(); render(vals,out,true); scheduleFit();});
  sync(); render(vals,out,false);
  return {vals,out,rerender:()=>{render(vals,out,false); scheduleFit();}};
}
function opChain(a,b,c,d,op){
  const L=lcm(b,d), x=a*L/b, y=c*L/d, s=op==='+'?x+y:x-y, sg=op==='+'?'+':MINUS, den=b===d?b:L;
  let h=`${fr(a,b)} ${sg} ${fr(c,d)}`;
  if(b!==d) h+=` = ${fr(x,L)} ${sg} ${fr(y,L)}`;
  h+=s===0?' = 0':` = ${fr(s,den)}${chainTail(s,den)}`;
  return {h,L,x,y,s,den};
}

  const seen=new Set([correct]), opts=[{h:correct,c:true}];
  wrongs.forEach(w=>{if(!seen.has(w)){seen.add(w);opts.push({h:w,c:false});}});
  return {text,kind:'mc',options:opts,exp,vis};
}

    if(raw===''||isNaN(+raw)) return {s:'retry',m:'Tulis angkanya dulu, ya.'};
    return Math.abs(+raw-q.ans)<1e-9?{s:'ok'}:{s:'bad'};
  }
  if(q.kind==='frac'){
    const n=pint(g('[data-n]')), d=pint(g('[data-d]'));
    if(isNaN(n)||isNaN(d)||d===0) return {s:'retry',m:'Isi pembilang dan penyebut dengan angka. Penyebut tidak boleh nol.'};
    if(q.mode==='exact') return n===q.ans.n&&d===q.ans.d?{s:'ok'}:{s:'bad'};
    if(n*q.ans.d!==d*q.ans.n) return {s:'bad'};
    if(gcd(n,d)!==1) return {s:'retry',m:'Nilainya sudah benar, tetapi belum paling sederhana. Sederhanakan lagi, ya!'};
    return {s:'ok'};
  }
  const w=pz(g('[data-w]')), n=pz(g('[data-n]')), d=pz(g('[data-d]'));
  if(isNaN(w)||isNaN(n)||isNaN(d)) return {s:'retry',m:'Isi kotak dengan angka saja.'};
  if(n>0&&d===0) return {s:'retry',m:'Penyebut tidak boleh nol.'};
  const A=q.ans;
  if(n===0||(w*d+n)*A.d!==(A.w*A.d+A.n)*d) return {s:'bad'};
  if(n>=d) return {s:'retry',m:'Nilainya benar, tetapi pada pecahan campuran pembilang harus lebih kecil dari penyebut.'};
  if(gcd(n,d)!==1) return {s:'retry',m:'Nilainya benar, tetapi pecahannya masih bisa disederhanakan.'};
  return {s:'ok'};
}
function initPractice(topic){
  const el=$('#pr-'+topic); let qs,idx,score,locked;
  el.innerHTML=`<p class="note" data-best="${topic}" style="margin:0"></p>
  <div data-run><div class="qbar" aria-hidden="true"><i data-prog></i></div><p class="note" data-num style="margin:2px 0 0"></p>
  <div class="qtext" data-q></div><div class="qvis" data-vis></div><div class="qin" data-in></div><div class="fbtxt" data-fb role="status" aria-live="polite"></div>
  <div class="row" style="margin-top:4px"><button class="btn" data-check>Periksa</button><button class="btn" data-next hidden>Lanjut</button></div></div>
  <div data-end hidden style="text-align:center"><div class="pstar" data-stars aria-hidden="true"></div><h3 data-msg></h3><p data-sc></p>
  <div class="row" style="justify-content:center"><button class="btn" data-again>Soal baru</button><button class="btn alt" data-nexttopic></button></div></div>`;
  const run=$('[data-run]',el), end=$('[data-end]',el), inEl=$('[data-in]',el), fb=$('[data-fb]',el), chk=$('[data-check]',el), nxt=$('[data-next]',el);
  const nextId=TOPICS[TOPICS.indexOf(topic)+1];
  const nb=$('[data-nexttopic]',el); nb.textContent=nextId?'Materi berikutnya →':'Kembali ke beranda'; nb.dataset.go=nextId||'beranda';
  function start(){
    const gens=GEN[topic]; let order=shuffle(gens.slice()); while(order.length<5) order.push(pick(gens));
    qs=order.slice(0,5).map(g=>g()); qs.forEach(q=>{if(q.kind==='mc') q.options=shuffle(q.options.slice());});
    idx=0; score=0; run.hidden=false; end.hidden=true; show();
  }
  function show(){
    const q=qs[idx]; locked=false;
    $('[data-num]',el).textContent=`Soal ${idx+1} dari ${qs.length}`;
    $('[data-prog]',el).style.width=(idx/qs.length*100)+'%';
    $('[data-q]',el).innerHTML=q.text; $('[data-vis]',el).innerHTML=q.vis||'';
    fb.innerHTML=''; nxt.hidden=true; chk.hidden=(q.kind==='mc');
    nxt.textContent=idx===qs.length-1?'Lihat hasil':'Lanjut';
    const unit=q.unit&&q.kind!=='frac'?`<span class="unit">${q.unit}</span>`:'';
    if(q.kind==='mc') inEl.innerHTML=`<div class="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="ltr">${'ABCD'[i]}</span><span>${o.h}</span></button>`).join('')}</div>`;
    else if(q.kind==='num') inEl.innerHTML=`<input type="text" inputmode="decimal" data-a aria-label="Jawaban" autocomplete="off">${unit}`;
    else if(q.kind==='frac') inEl.innerHTML=`<span class="stack"><input type="text" inputmode="numeric" data-n aria-label="Pembilang" autocomplete="off"><hr><input type="text" inputmode="numeric" data-d aria-label="Penyebut" autocomplete="off"></span>${q.unit?`<span class="unit">${q.unit}</span>`:''}`;
    else inEl.innerHTML=`<input type="text" inputmode="numeric" data-w aria-label="Bilangan bulat" autocomplete="off"><span class="stack"><input type="text" inputmode="numeric" data-n aria-label="Pembilang" autocomplete="off"><hr><input type="text" inputmode="numeric" data-d aria-label="Penyebut" autocomplete="off"></span>`;
    scheduleFit();
  }
  function finish(ok){
    locked=true; const q=qs[idx];
    $$('input',inEl).forEach(i=>i.disabled=true); chk.hidden=true; nxt.hidden=false;
    if(ok){score++; sfx.ok(); fb.innerHTML=`<span class="good">Benar!</span> ${q.exp}`;}
    else{sfx.bad(); fb.innerHTML=`<span class="badt">Belum tepat.</span> Jawaban benar: <span class="ie">${ansHtml(q)}</span><br>${q.exp}`;}
    scheduleFit();
  }
  function check(){
    if(locked) return; const q=qs[idx], r=judge(q,el);
    if(r.s==='retry'){fb.innerHTML=`<span class="warn">${r.m}</span>`; sfx.click(); scheduleFit(); return;}
    finish(r.s==='ok');
  }
  chk.addEventListener('click',check);
  inEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();check();}});
  inEl.addEventListener('click',e=>{
    const b=e.target.closest('.opt'); if(!b||locked) return;
    const q=qs[idx], pickI=+b.dataset.i;
    $$('.opt',inEl).forEach((x,i)=>{x.disabled=true; if(q.options[i].c) x.classList.add('ok'); else if(i===pickI) x.classList.add('bad');});
    finish(q.options[pickI].c);
  });
  nxt.addEventListener('click',()=>{
    if(idx<qs.length-1){idx++; show();}
    else{
      run.hidden=true; end.hidden=false;
      $('[data-stars]',el).innerHTML=Array.from({length:5},(_,i)=>`<span class="${i<score?'':'off'}">★</span>`).join('');
      $('[data-msg]',el).textContent=score===5?'Sempurna! Kamu hebat sekali.':score===4?'Bagus sekali! Tinggal sedikit lagi.':score===3?'Lumayan. Lihat lagi animasinya, lalu coba soal baru.':'Tidak apa-apa. Tonton animasinya sekali lagi, lalu coba lagi.';
      $('[data-sc]',el).textContent=`Skor kamu: ${score} dari 5.`+(score>=4?' Materi ini lulus!':' Raih skor 4 atau 5 untuk lulus.');
      if((state.best[topic]||0)<score){state.best[topic]=score; save();}
      refreshProgress();
      if(score>=4){sfx.win(); if(score===5) confetti();} else sfx.click();
      scheduleFit();
    }
  });
  $('[data-again]',el).addEventListener('click',()=>{sfx.click(); start();});
  start();
}
TOPICS.forEach(initPractice);

/* ===== Konfeti ===== */
function confetti(){
  if(reduce) return;
  const cv=$('#confetti'), cx=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#FFC933','#FF8FA3','#1FAE97','#3E7BFA','#E5484D'];
  const ps=Array.from({length:130},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:5+Math.random()*7,c:pick(cols),r:Math.random()*6}));
  const t0=performance.now();
  (function frame(t){
    cx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.15;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});
    if(t-t0<2800) requestAnimationFrame(frame); else cx.clearRect(0,0,cv.width,cv.height);
  })(t0);
}

/* ===== Satu layar penuh: penyesuaian ukuran ===== */
function scheduleFit(){cancelAnimationFrame(fitRaf); fitRaf=requestAnimationFrame(fitAll);}
function fitOne(box){
  const inn=box.firstElementChild; if(!inn||box.offsetParent===null) return;
  inn.style.transform='none';
  const bw=box.clientWidth, bh=box.clientHeight; if(!bw||!bh) return;
  const w=inn.scrollWidth, h=inn.scrollHeight;
  const k=Math.max(.35,Math.min(1,bh/h,bw/w));
  inn.style.transform=k<1?`scale(${k.toFixed(3)})`:'none';
}
function fitAll(){$$('.fitbox').forEach(fitOne);}

/* ===== Beranda & navigasi ===== */
$('#menu').innerHTML=TOP.map(p=>`<button class="mitem" data-go="${p.id}" data-menu="${p.id}" style="--c:${p.c};--bg:${p.bg}"><span class="sym">${p.sym}</span><b>${p.label}</b><small>${p.desc}</small><span class="chk" aria-hidden="true">✓</span></button>`).join('');
(function(){
  let s='';
  for(let i=0;i<8;i++){
    const a1=-Math.PI/2+i*Math.PI/4, a2=a1+Math.PI/4, R=112;

  }
  s+=`<circle cx="180" cy="150" r="46" style="fill:var(--card);stroke:var(--ink);stroke-width:5"/>
  <text x="180" y="150" text-anchor="middle" style="font:800 44px 'Baloo 2',sans-serif;fill:var(--ink)">3</text>
  <line x1="156" y1="157" x2="204" y2="157" style="stroke:var(--ink);stroke-width:5;stroke-linecap:round"/>
  <text x="180" y="196" text-anchor="middle" style="font:800 44px 'Baloo 2',sans-serif;fill:var(--ink)">8</text>`;
  $('#heroPie').innerHTML=s;
})();
const passed=id=>(state.best[id]||0)>=4;
function refreshProgress(){
  const m=TOPICS.filter(id=>state.visited[id]).length, l=TOPICS.filter(passed).length;
  $('#progressText').textContent=`Materi dibuka: ${m} dari 8 · Latihan lulus: ${l} dari 8`;
  $$('[data-menu]').forEach(b=>b.classList.toggle('done',passed(b.dataset.menu)));
  $$('[data-best]').forEach(p=>{const b=state.best[p.dataset.best]; p.textContent=b!=null?`Skor terbaikmu: ${b} dari 5`:'Kerjakan 5 soal. Soal berganti setiap kali diulang.';});
}
let cur='beranda';
function setTab(id,tab){
  const sec=$('#s-'+id);
  $$('[data-pane]',sec).forEach(p=>{p.hidden=(p.dataset.pane!==tab);});
  $$('.tabs3 button',sec).forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===tab));
  if(tab==='anim') players[id].start(); else players[id].stop();
  scheduleFit();
}
function go(id,silent){
  Object.keys(players).forEach(k=>players[k].stop());
  $$('.screen').forEach(s=>{s.hidden=(s.id!=='s-'+id);});
  cur=id;
  if(TOPICS.includes(id)){state.visited[id]=true; save(); setTab(id,'anim');}
  refreshProgress();
  if(!silent) sfx.click();
  scheduleFit();
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){go(g.dataset.go); return;}
  const n=e.target.closest('[data-nav]');
  if(n){const t=TOPICS[TOPICS.indexOf(cur)+(+n.dataset.nav)]; go(t||'beranda'); return;}
  const tb=e.target.closest('[data-tab]');
  if(tb){const sec=tb.closest('.screen'); sfx.click(); setTab(sec.id.slice(2),tb.dataset.tab); return;}
  const sb=e.target.closest('[data-sub]');
  if(sb){
    const sec=sb.closest('.screen');
    $$('.wdg',sec).forEach(w=>{w.hidden=(w.id!==sb.dataset.sub);});
    $$('[data-sub]',sec).forEach(b=>b.setAttribute('aria-pressed',b===sb));
    sfx.pop(); scheduleFit();
  }
});
if(window.ResizeObserver) new ResizeObserver(scheduleFit).observe($('#main'));
window.addEventListener('resize',scheduleFit);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(scheduleFit);

const fsb=$('#fsBtn');
if(!(document.fullscreenEnabled||document.webkitFullscreenEnabled)) fsb.hidden=true;
else fsb.addEventListener('click',()=>{try{if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();}catch(e){}});
updateTools(); refreshProgress(); go('beranda',true);
window.__app={go,setTab,players,GEN,judge,TOPICS,SC};
})();
